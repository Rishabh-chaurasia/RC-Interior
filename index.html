<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RC Interior — Commercial Interiors, Gurugram</title>
    <meta name="description" content="RC Interior designs and builds workplaces for India's leading companies. Corporate, retail and turnkey interiors from Gurugram since 2007." />
    <meta name="theme-color" content="#faf7f1" />
    <script>
      document.documentElement.classList.add('js');
      // saved colour theme (hooks/theme.js), applied before first paint so the page never flashes
      try {
        var t = localStorage.getItem('rc-theme'), m = { stone: '#e9e8e5', sage: '#e3e9df', blush: '#f3e4e1', terracotta: '#f1e3d8', espresso: '#1f1915', charcoal: '#1c1d1f', midnight: '#141b26', forest: '#17211b' };
        if (m[t]) { document.documentElement.dataset.theme = t; document.querySelector('meta[name="theme-color"]').content = m[t]; }
      } catch (e) {}
    </script>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
